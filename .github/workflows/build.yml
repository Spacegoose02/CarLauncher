# Builds the debug APK and runs the unit tests on every push and pull request.
# On main it also refreshes the "latest-debug" pre-release, so the newest APK is one tap away on the tablet.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/CarLauncher-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: CarLauncher-debug-apk
          path: out/*.apk

      - name: Publish latest-debug pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug out/*.apk \
            --prerelease \
            --title "Latest debug build" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. Install it with 'allow unknown apps' on."
