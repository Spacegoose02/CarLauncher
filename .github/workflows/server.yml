# Tests the config server and builds its Docker image. On main it also publishes the image to
# ghcr.io/spacegoose02/carlauncher-config, so a home server can pull it instead of building it.
name: Config server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 for PCs and NAS boxes, arm64 for a Raspberry Pi
      - name: Build (and publish on main)
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/spacegoose02/carlauncher-config:latest
